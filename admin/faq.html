<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Управління FAQ · РІДНЯ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .faq-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .faq-item-question { font-weight: 700; font-size: 1.1rem; }
    .faq-item-answer { background: #f7fafc; padding: 16px; border-radius: 16px; margin-top: 8px; }
    .faq-item-actions { display: flex; gap: 8px; }
  </style>
</head>
<body>
<div class="admin-container">
  <div class="admin-header">
    <h1><i class="fas fa-question-circle"></i> Управління FAQ</h1>
    <div class="header-actions">
      <a href="../index.html" class="btn btn-outline">На головну</a>
      <button id="logoutBtn" class="btn btn-outline">Вийти</button>
      <button id="addQuestionBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Додати питання</button>
    </div>
  </div>
  <div id="faqList"></div>
</div>

<div id="faqModal" class="modal-overlay" style="display: none;">
  <div class="modal">
    <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Нове питання</h2>
    <div class="form-group"><label>Питання</label><input type="text" id="faqQuestion" placeholder="Ваше питання"></div>
    <div class="form-group"><label>Відповідь (HTML)</label><textarea id="faqAnswer" rows="5"></textarea></div>
    <div class="modal-footer">
      <button id="cancelModalBtn" class="btn btn-outline">Скасувати</button>
      <button id="saveQuestionBtn" class="btn btn-primary">Зберегти</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="admin-faq.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
