<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управління FAQ · Адмін · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/admin-auth.js"></script>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-question-circle"></i> Управління FAQ</h1>
      <div style="display: flex; gap: 12px;">
        <a href="../index.html" class="admin-home-btn">🏠 На головну</a>
        <button class="admin-logout" onclick="if(window.signOut) signOut();">Вийти</button>
      </div>
    </div>
    <div style="margin-bottom: 30px; text-align: center;">
      <button id="addFaqBtn" class="btn-submit" style="background: var(--yellow); color: #1f2937;"><i class="fas fa-plus"></i> Додати питання</button>
    </div>
    <div id="faqAdminList" style="max-width: 800px; margin: 0 auto;"></div>
  </div>

  <!-- Модальне вікно для FAQ -->
  <div class="modal-overlay" id="faqAdminModal">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="faqAdminModalTitle"><i class="fas fa-plus"></i> Нове питання</h2>
        <button class="modal-close" id="closeFaqModalBtn">&times;</button>
      </div>
      <form id="addFaqForm">
        <div class="form-group">
          <label>Питання</label>
          <input type="text" id="faqQuestion" required placeholder="Наприклад, Як приєднатися до клубу?">
        </div>
        <div class="form-group">
          <label>Відповідь (HTML)</label>
          <textarea id="faqAnswer" rows="6" required placeholder="Текст відповіді, можна з HTML-тегами (p, ul, strong...)"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="cancelFaqBtn">Скасувати</button>
          <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Зберегти</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/admin-faq.js"></script>
</body>
</html>
