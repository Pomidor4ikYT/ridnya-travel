<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управління FAQ · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Manrope:wght@600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    /* Специфічні стилі тільки для списку FAQ */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .faq-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }
    .faq-item-question {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a202c;
      flex: 1;
      line-height: 1.4;
    }
    .faq-item-answer {
      color: #4a5568;
      line-height: 1.7;
      font-size: 0.95rem;
      padding: 12px 16px;
      background: #f7fafc;
      border-radius: 14px;
      margin-top: 8px;
    }
    .faq-item-answer p { margin: 0 0 8px; }
    .faq-item-answer ul { margin: 8px 0; padding-left: 20px; }
    .faq-item-answer li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-question-circle"></i> Управління FAQ</h1>
      <div class="header-actions">
        <a href="../index.html" class="btn btn-outline"><i class="fas fa-home"></i> На головну</a>
        <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Вийти</button>
        <button id="addQuestionBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Додати питання</button>
      </div>
    </div>
    <div id="faqList" class="faq-list"></div>
  </div>

  <!-- Модальне вікно -->
  <div id="faqModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Нове питання</h2>
      <div class="form-group">
        <label for="faqQuestion">Питання</label>
        <input type="text" id="faqQuestion" placeholder="Наприклад, Як приєднатися до клубу?">
      </div>
      <div class="form-group">
        <label for="faqAnswer">Відповідь (дозволено HTML)</label>
        <textarea id="faqAnswer" rows="6" placeholder="Текст відповіді..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="cancelModalBtn" class="btn btn-outline">Скасувати</button>
        <button id="saveQuestionBtn" class="btn btn-primary"><i class="fas fa-save"></i> Зберегти</button>
      </div>
    </div>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function() {
      const STORAGE_KEY = 'ridnya_faq';
      let faqItems = [], editingId = null;
      function loadFaq() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          faqItems = stored ? JSON.parse(stored) : [
            { id: '1', question: 'Правила туристичного клубу', answer: '<p><strong>1. Добровільне членство.</strong></p>...' },
            { id: '2', question: 'Як приєднатися до клубу?', answer: '<p>Просто зв\'яжіться з нами через форму на сторінці «Контакти» або напишіть у соцмережі.</p>' },
            { id: '3', question: 'Який рівень підготовки потрібен?', answer: '<p>У нас є маршрути різної складності — обирайте за бажанням.</p>' },
            { id: '4', question: 'Що брати з собою?', answer: '<p>Зручне взуття, дощовик, воду, перекус, ліхтарик, аптечку.</p>' },
            { id: '5', question: 'Чи є благодійні внески?', answer: '<p>Походи безкоштовні, але ми раді внескам на підтримку ЗСУ.</p>' }
          ];
        } catch (e) { faqItems = []; }
        renderFaq();
      }
      function saveFaq() { localStorage.setItem(STORAGE_KEY, JSON.stringify(faqItems)); }
      function renderFaq() {
        const container = document.getElementById('faqList');
        if (!container) return;
        if (!faqItems.length) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:#718096;"><i class="fas fa-folder-open" style="font-size:3rem; opacity:0.3;"></i><p>Немає жодного питання.</p></div>';
          return;
        }
        container.innerHTML = faqItems.map(item => `
          <div class="card" data-id="${item.id}">
            <div class="faq-item-header">
              <div class="faq-item-question">${escapeHtml(item.question)}</div>
              <div class="faq-item-actions">
                <button class="icon-btn edit-btn" data-id="${item.id}"><i class="fas fa-pen"></i></button>
                <button class="icon-btn delete-btn" data-id="${item.id}"><i class="fas fa-trash"></i></button>
              </div>
            </div>
            <div class="faq-item-answer">${item.answer}</div>
          </div>
        `).join('');
        document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
        document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => deleteQuestion(btn.dataset.id)));
      }
      function openAddModal() {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Нове питання';
        document.getElementById('faqQuestion').value = '';
        document.getElementById('faqAnswer').value = '';
        document.getElementById('faqModal').style.display = 'flex';
      }
      function openEditModal(id) {
        const item = faqItems.find(i => i.id === id);
        if (!item) return;
        editingId = id;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-pen"></i> Редагувати питання';
        document.getElementById('faqQuestion').value = item.question;
        document.getElementById('faqAnswer').value = item.answer;
        document.getElementById('faqModal').style.display = 'flex';
      }
      function closeModal() {
        document.getElementById('faqModal').style.display = 'none';
        editingId = null;
      }
      function saveQuestion() {
        const q = document.getElementById('faqQuestion').value.trim();
        const a = document.getElementById('faqAnswer').value.trim();
        if (!q || !a) { alert('Заповніть поля'); return; }
        if (editingId) {
          const idx = faqItems.findIndex(i => i.id === editingId);
          if (idx !== -1) { faqItems[idx].question = q; faqItems[idx].answer = a; }
        } else {
          faqItems.push({ id: Date.now().toString(), question: q, answer: a });
        }
        saveFaq(); renderFaq(); closeModal();
      }
      function deleteQuestion(id) {
        if (!confirm('Видалити?')) return;
        faqItems = faqItems.filter(i => i.id !== id);
        saveFaq(); renderFaq();
      }
      function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
      document.addEventListener('DOMContentLoaded', () => {
        loadFaq();
        document.getElementById('addQuestionBtn').addEventListener('click', openAddModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
        document.getElementById('saveQuestionBtn').addEventListener('click', saveQuestion);
        document.getElementById('logoutBtn').addEventListener('click', () => { if (window.signOut) signOut(); });
        document.getElementById('faqModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
      });
    })();
  </script>
</body>
</html>
