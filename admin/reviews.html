<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управління відгуками · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-container">
  <div class="admin-header">
    <h1><i class="fas fa-star"></i> Відгуки</h1>
    <div class="header-actions">
      <a href="../index.html" class="btn btn-outline"><i class="fas fa-home"></i> На головну</a>
      <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Вийти</button>
      <button id="addReviewBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Додати відгук</button>
    </div>
  </div>

  <!-- Фільтри -->
  <div class="reviews-filters">
    <button class="review-filter-btn active" data-filter="all">Усі</button>
    <button class="review-filter-btn" data-filter="approved">Опубліковані</button>
    <button class="review-filter-btn" data-filter="pending">На модерації</button>
  </div>

  <div id="reviewsList" class="reviews-admin-grid"></div>
</div>

<!-- Модальне вікно додавання/редагування -->
<div id="reviewModal" class="modal-overlay">
  <div class="modal">
    <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Новий відгук</h2>
    <div class="form-group"><label>Ім'я</label><input type="text" id="reviewName" placeholder="Ім'я автора"></div>
    <div class="form-group"><label>Вік</label><input type="number" id="reviewAge" placeholder="28"></div>
    <div class="form-group"><label>Текст відгуку</label><textarea id="reviewText" rows="4" placeholder="Текст відгуку..."></textarea></div>
    <div class="form-group"><label>Рейтинг (1-5)</label><select id="reviewRating"><option value="5">5 зірок</option><option value="4">4 зірки</option><option value="3">3 зірки</option><option value="2">2 зірки</option><option value="1">1 зірка</option></select></div>
    <div class="form-group"><label>Статус</label><select id="reviewStatus"><option value="pending">На модерації</option><option value="approved">Опубліковано</option></select></div>
    <div class="modal-footer">
      <button id="cancelReviewModal" class="btn btn-outline">Скасувати</button>
      <button id="saveReviewBtn" class="btn btn-primary">Зберегти</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="admin-reviews.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
