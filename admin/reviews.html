<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відгуки · Адмін · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/admin-auth.js"></script>
</head>
<body>
  <div class="admin-container">
<div class="admin-header">
  <h1>✍️ Управління відгуками</h1>
  <div style="display: flex; gap: 12px;">
    <a href="../index.html" class="admin-home-btn">🏠 На головну</a>
    <button class="admin-logout" onclick="if(window.signOut) signOut();">Вийти</button>
  </div>
</div>
      <form id="addReviewForm">
        <div class="form-group"><label>Ім'я</label><input type="text" id="reviewName" required></div>
        <div class="form-group"><label>Вік</label><input type="number" id="reviewAge" required></div>
        <div class="form-group"><label>Текст відгуку</label><textarea id="reviewText" rows="3" required></textarea></div>
        <div class="form-group"><label>Рейтинг (1-5)</label><select id="reviewRating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div>
        <button type="submit" class="btn-submit">Додати відгук</button>
      </form>
    </div>
    <table class="reviews-table"><thead><tr><th>ID</th><th>Ім'я</th><th>Вік</th><th>Відгук</th><th>Рейтинг</th><th>Статус</th><th>Дії</th></tr></thead><tbody id="reviewsTableBody"></tbody></table>
  </div>
  <script src="../js/admin-reviews.js"></script>
</body>
</html>
