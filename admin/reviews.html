<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управління відгуками · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside class="admin-sidebar">
    <div class="logo">
      <img src="../images/logo.jpg" alt="РІДНЯ">
      <h1>РІДНЯ</h1>
    </div>
    <nav class="admin-nav">
      <a href="../index.html"><i class="fas fa-home"></i> На сайт</a>
      <a href="applications.html"><i class="fas fa-clipboard-list"></i> Заявки</a>
      <a href="reviews.html" class="active"><i class="fas fa-star"></i> Відгуки</a>
      <a href="faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
      <div class="logout">
        <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Вийти</a>
      </div>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1><i class="fas fa-star" style="color:var(--admin-primary);"></i> Відгуки</h1>
      <div class="actions">
        <a href="../index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> На головну</a>
        <button id="addReviewBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Додати відгук</button>
      </div>
    </div>

    <!-- Фільтри -->
    <div class="reviews-filters" style="display:flex; gap:12px; background:white; padding:12px 20px; border-radius:60px; margin-bottom:24px; box-shadow:var(--admin-card-shadow); flex-wrap:wrap;">
      <button class="review-filter-btn active" data-filter="all">Усі</button>
      <button class="review-filter-btn" data-filter="approved">Опубліковані</button>
      <button class="review-filter-btn" data-filter="pending">На модерації</button>
    </div>

    <div id="reviewsList" class="reviews-admin-grid"></div>
  </main>

  <!-- Модалка додавання/редагування -->
  <div id="reviewModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Новий відгук</h2>
        <button class="modal-close" id="closeReviewModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>Ім'я</label><input type="text" id="reviewName" placeholder="Ім'я автора"></div>
        <div class="form-group"><label>Вік</label><input type="number" id="reviewAge" placeholder="28"></div>
        <div class="form-group"><label>Текст відгуку</label><textarea id="reviewText" rows="4" placeholder="Текст відгуку..."></textarea></div>
        <div class="form-group"><label>Рейтинг (1-5)</label><select id="reviewRating"><option value="5">5 зірок</option><option value="4">4 зірки</option><option value="3">3 зірки</option><option value="2">2 зірки</option><option value="1">1 зірка</option></select></div>
        <div class="form-group"><label>Статус</label><select id="reviewStatus"><option value="pending">На модерації</option><option value="approved">Опубліковано</option></select></div>
      </div>
      <div class="modal-footer">
        <button id="cancelReviewModal" class="btn-cancel">Скасувати</button>
        <button id="saveReviewBtn" class="btn btn-primary">Зберегти</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="admin-reviews.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
      e.preventDefault();
      if (window.signOut) signOut();
    });
    // Прив'язка закриття модалки
    document.getElementById('closeReviewModalBtn')?.addEventListener('click', function() {
      document.getElementById('reviewModal').style.display = 'none';
    });
    document.getElementById('cancelReviewModal')?.addEventListener('click', function() {
      document.getElementById('reviewModal').style.display = 'none';
    });
    document.getElementById('reviewModal')?.addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });
  </script>
</body>
</html>
