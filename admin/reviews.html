<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відгуки · РІДНЯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Manrope:wght@600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-star"></i> Управління відгуками</h1>
      <div class="header-actions">
        <a href="../index.html" class="btn btn-outline"><i class="fas fa-home"></i> На головну</a>
        <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Вийти</button>
        <button id="addReviewBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Додати відгук</button>
      </div>
    </div>

    <div id="reviewsList"></div>
  </div>

  <!-- Модальне вікно додавання/редагування -->
  <div id="reviewModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Новий відгук</h2>
      <div class="form-group">
        <label>Ім'я</label>
        <input type="text" id="reviewName" placeholder="Ім'я автора">
      </div>
      <div class="form-group">
        <label>Текст відгуку</label>
        <textarea id="reviewText" rows="4" placeholder="Текст відгуку..."></textarea>
      </div>
      <div class="form-group">
        <label>Рейтинг (1-5)</label>
        <select id="reviewRating">
          <option value="5">5 зірок</option>
          <option value="4">4 зірки</option>
          <option value="3">3 зірки</option>
          <option value="2">2 зірки</option>
          <option value="1">1 зірка</option>
        </select>
      </div>
      <div class="modal-footer">
        <button id="cancelReviewModal" class="btn btn-outline">Скасувати</button>
        <button id="saveReviewBtn" class="btn btn-primary"><i class="fas fa-save"></i> Зберегти</button>
      </div>
    </div>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function() {
      const STORAGE_KEY = 'ridnya_reviews';
      let reviews = [], editingId = null;

      function loadReviews() {
        const stored = localStorage.getItem(STORAGE_KEY);
        reviews = stored ? JSON.parse(stored) : [];
        renderReviews();
      }

      function saveReviews() { localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews)); }

      function renderReviews() {
        const container = document.getElementById('reviewsList');
        if (!container) return;
        if (!reviews.length) {
          container.innerHTML = '<div style="text-align:center; padding:40px; color:#718096;"><i class="fas fa-comment-slash" style="font-size:3rem; opacity:0.3;"></i><p>Немає відгуків</p></div>';
          return;
        }
        container.innerHTML = reviews.map(r => `
          <div class="card" style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${escapeHtml(r.name)}</strong>
              <div style="color: #f6ad55;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              <div style="font-size: 0.9rem; color: #4a5568; margin-top: 4px;">${escapeHtml(r.text)}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="icon-btn edit-review" data-id="${r.id}"><i class="fas fa-pen"></i></button>
              <button class="icon-btn delete-review" data-id="${r.id}"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.edit-review').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
        document.querySelectorAll('.delete-review').forEach(btn => btn.addEventListener('click', () => deleteReview(btn.dataset.id)));
      }

      function openAddModal() {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Новий відгук';
        document.getElementById('reviewName').value = '';
        document.getElementById('reviewText').value = '';
        document.getElementById('reviewRating').value = '5';
        document.getElementById('reviewModal').style.display = 'flex';
      }

      function openEditModal(id) {
        const r = reviews.find(r => r.id === id);
        if (!r) return;
        editingId = id;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-pen"></i> Редагувати відгук';
        document.getElementById('reviewName').value = r.name;
        document.getElementById('reviewText').value = r.text;
        document.getElementById('reviewRating').value = r.rating;
        document.getElementById('reviewModal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('reviewModal').style.display = 'none';
        editingId = null;
      }

      function saveReview() {
        const name = document.getElementById('reviewName').value.trim();
        const text = document.getElementById('reviewText').value.trim();
        const rating = parseInt(document.getElementById('reviewRating').value);
        if (!name || !text) { alert('Заповніть ім\'я та текст'); return; }
        if (editingId) {
          const idx = reviews.findIndex(r => r.id === editingId);
          if (idx !== -1) { reviews[idx].name = name; reviews[idx].text = text; reviews[idx].rating = rating; }
        } else {
          reviews.push({ id: Date.now().toString(), name, text, rating });
        }
        saveReviews(); renderReviews(); closeModal();
      }

      function deleteReview(id) {
        if (!confirm('Видалити відгук?')) return;
        reviews = reviews.filter(r => r.id !== id);
        saveReviews(); renderReviews();
      }

      function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }

      document.addEventListener('DOMContentLoaded', () => {
        loadReviews();
        document.getElementById('addReviewBtn').addEventListener('click', openAddModal);
        document.getElementById('cancelReviewModal').addEventListener('click', closeModal);
        document.getElementById('saveReviewBtn').addEventListener('click', saveReview);
        document.getElementById('reviewModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
        document.getElementById('logoutBtn').addEventListener('click', () => { if (window.signOut) signOut(); });
      });
    })();
  </script>
</body>
